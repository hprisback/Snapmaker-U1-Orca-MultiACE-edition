{"name":"Build Patch Installer","on":{"workflow_dispatch":{}},"jobs":{"build":{"name":"Build MultiACEPatchesInstaller","runs-on":"windows-latest","steps":[{"name":"Checkout","uses":"actions/checkout@v6"},{"name":"Install build requirements","shell":"pwsh","working-directory":"patch-installer","run":"python -m pip install --upgrade pip; pip install -r packaging/requirements-build.txt"},{"name":"Build portable exe","shell":"pwsh","working-directory":"patch-installer","run":"powershell -ExecutionPolicy Bypass -File packaging/build_installer.ps1 -PythonExe (Get-Command python).Source"},{"name":"List output","shell":"pwsh","working-directory":"patch-installer","run":"Get-ChildItem -Recurse dist"},{"name":"Upload installer","uses":"actions/upload-artifact@v7","with":{"name":"MultiACEPatchesInstaller","path":"patch-installer/dist/MultiACEPatchesInstaller.exe","if-no-files-found":"error"}}]}}}
